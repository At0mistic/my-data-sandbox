version: 2

sources:
  - name: raw_data
    database: data_warehouse
    schema: public
    tables:
      - name: stg_raw_weather
      - name: stg_raw_market_data
        description: "Cours quotidiens bruts du MSCI World ou de l'ETF URTH."

models:
  - name: stg_market_data
    description: "Cours quotidiens nettoyés récupérés depuis Yahoo Finance."
    columns:
      - name: ticker
        description: "Symbole Yahoo Finance utilisé pour le cours."
        tests:
          - not_null
      - name: trade_date
        description: "Date de séance."
        tests:
          - not_null
      - name: close
        description: "Cours de clôture non ajusté."
      - name: adj_close
        description: "Cours de clôture ajusté des distributions."