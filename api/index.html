<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 16px;
            display: none;
        }

        .weather-card {
            display: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-icon {
            font-size: 80px;
            margin: 20px 0;
        }

        .city-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 48px;
            font-weight: 700;
            margin: 15px 0;
        }

        .weather-description {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            padding-top: 20px;
        }

        .detail {
            font-size: 14px;
        }

        .detail-label {
            opacity: 0.8;
            font-size: 12px;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 5px;
        }

        .error {
            display: none;
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
        }

        .timestamp {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Dashboard</h1>
        
        <div class="buttons">
            <button onclick="getLatestWeather()">Latest Record</button>
            <button onclick="getNantesWeather()">Nantes</button>
        </div>

        <div class="loading" id="loading">Loading...</div>

        <div class="weather-card" id="weatherCard">
            <div class="city-name" id="cityName"></div>
            <div class="weather-icon" id="weatherIcon"></div>
            <div class="temperature" id="temperature"></div>
            <div class="weather-description" id="weatherDescription"></div>
            
            <div class="weather-details">
                <div class="detail">
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
                <div class="detail">
                    <div class="detail-label">Fetched At</div>
                    <div class="detail-value" id="fetchedAt"></div>
                </div>
            </div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        // Weather code to emoji mapping
        const weatherIcons = {
            0: '☀️',   // Clear sky
            1: '🌤️',   // Mainly clear
            2: '⛅',   // Partly cloudy
            3: '☁️',   // Overcast
            45: '🌫️',  // Foggy
            48: '🌫️',  // Depositing rime fog
            51: '🌧️',  // Light drizzle
            53: '🌧️',  // Moderate drizzle
            55: '🌧️',  // Dense drizzle
            61: '🌧️',  // Slight rain
            63: '🌧️',  // Moderate rain
            65: '⛈️',  // Heavy rain
            71: '❄️',   // Slight snow
            73: '❄️',   // Moderate snow
            75: '❄️',   // Heavy snow
            77: '❄️',   // Snow grains
            80: '🌧️',  // Slight rain showers
            81: '🌧️',  // Moderate rain showers
            82: '⛈️',  // Violent rain showers
            85: '❄️',   // Slight snow showers
            86: '❄️',   // Heavy snow showers
            95: '⛈️',  // Thunderstorm
            96: '⛈️',  // Thunderstorm with slight hail
            99: '⛈️',  // Thunderstorm with heavy hail
        };

        function getWeatherIcon(code) {
            return weatherIcons[code] || '🌤️';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function displayWeather(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            
            const weather = data.data;
            
            document.getElementById('cityName').textContent = weather.city || 'Unknown';
            document.getElementById('weatherIcon').textContent = getWeatherIcon(weather.weather_code);
            document.getElementById('temperature').textContent = `${weather.temperature_celsius}°C`;
            document.getElementById('weatherDescription').textContent = weather.weather_description || 'No description';
            document.getElementById('windSpeed').textContent = `${weather.windspeed_kmh} km/h`;
            document.getElementById('fetchedAt').textContent = formatDate(weather.fetched_at);
            
            document.getElementById('weatherCard').style.display = 'block';
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('weatherCard').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = '❌ ' + message;
        }

        async function getLatestWeather() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('weatherCard').style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/weather/latest`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch latest weather');
                }
                
                const data = await response.json();
                displayWeather(data);
            } catch (error) {
                showError(error.message);
            }
        }

        async function getNantesWeather() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('weatherCard').style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/weather/latest?city=Nantes`);
                
                if (!response.ok) {
                    throw new Error('Nantes weather not found');
                }
                
                const data = await response.json();
                displayWeather(data);
            } catch (error) {
                showError(error.message);
            }
        }
    </script>
</body>
</html>
